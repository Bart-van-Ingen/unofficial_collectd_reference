name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push queues behind a running deploy rather
# than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Provides the address GitHub Pages serves the site from, e.g.
      # https://bart-van-ingen.github.io/unofficial_collectd_reference
      - id: pages
        uses: actions/configure-pages@v6

      # setup-uv publishes full version tags only; there is no floating v10 tag.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Clones the collectd sources and wiki, then writes docs/ and snippets/.
      # SITE_URL prefixes every internal link with the Pages base path.
      - name: Generate pages
        run: uv run collectd-docs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - name: Build site
        run: uv run zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
